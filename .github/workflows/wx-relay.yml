# Recomputes latest.json (the week ahead, today's NAT tracks, the observed weather of the week so far) four
# times a day, after the GFS cycles, and publishes it on the branch "data" as a single commit (force-pushed, so
# the repository does not grow):
#   https://raw.githubusercontent.com/<owner>/<repo>/data/latest.json
# The same commit carries cache/lightning-<week>.json and cache/mrms-<week>.json (the hours of lightning and
# radar data already read this week) and cache/gfs.json, cache/faa.json, cache/sigwx.json and cache/contrails.json
# (the GFS analyses, the FAA advisory pages, the SIGWX charts and the contrail classes of the last days already read),
# so the next run downloads only what is new. The run restores them from the data branch first; a missing or broken
# cache only means starting fresh, and a new week's run publishes no cache of the old week (the per-day caches keep
# only the days of the current window).
# relay.js exits 1 without writing when every part failed or the privacy check finds something; the
# publish step then does not run and the previous latest.json and caches stay in place.
# Stop note (2026-10-13): a host that answered HTTP 403/429 is written to cache/blocked.json and not contacted for 24 h by
# the following runs; the last step turns the run red while such an entry is in force. When the relay itself failed, the
# note is still published (next to the previous latest.json and caches), so the next run does not ask that host again.
# Backup slots (2026-10-13): GitHub dropped about one scheduled slot in four and started others up to 5 h late, so each
# main slot (04:30, 10:30, 16:30, 22:30 UTC) has a backup 71 minutes later. The job "gate" lets a scheduled run go ahead
# only when the data branch holds no latest.json generated since the latest main slot, so a backup after a main run that
# published (or a main run that comes after its backup) ends without a request to any source. Runs started from outside
# (cron-job.org calls workflow_dispatch, tools/wx-archive/CRON-JOB-SETUP.md) pass the same gate since 2026-10-13: a job set
# to every 10 minutes by mistake had started 144 full runs a day. Started by hand with "force" ticked (gh workflow run
# wx-relay.yml -f force=true) a run always runs. The dashboards count a run as published 3 hours after its main slot (WX_RL_RUN, WX_RL_LAG), which covers
# the backup.
name: WX relay

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
    - cron: "41 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a file was already published since the latest main slot (tick when starting by hand)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wx-relay
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - name: Run only when nothing was published since the latest main slot (scheduled and outside runs; by hand with force always)
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Started by hand with force - runs."; exit 0; fi
          now=$(date -u +%s); slot=0
          for back in 0 1; do
            d=$(date -u -d "@$(( now - back * 86400 ))" +%F)
            for h in 22 16 10 04; do s=$(date -u -d "$d $h:30" +%s); if [ "$s" -le "$now" ]; then slot=$s; break 2; fi; done
          done
          # No answer (no data branch, GitHub API down) = run: a backup must never be skipped for want of a check.
          gen="$(gh api -H "Accept: application/vnd.github.raw" "repos/${{ github.repository }}/contents/latest.json?ref=data" 2>/dev/null | jq -r '.generatedAt // empty' 2>/dev/null || true)"
          gs="$(date -u -d "$gen" +%s 2>/dev/null || echo 0)"
          if [ -n "$gen" ] && [ "$gs" -ge "$slot" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "latest.json of $gen is from after the main slot $(date -u -d "@$slot" +%FT%H:%MZ) - nothing to do (${{ github.event_name }} ${{ github.event.schedule }})."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No latest.json since the main slot $(date -u -d "@$slot" +%FT%H:%MZ) (found: ${gen:-none}) - runs (${{ github.event_name }} ${{ github.event.schedule }})."
          fi

  relay:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 60, not 40 (2026-10-12): the This-week parts (since.nat/gfs/faa) raised the worst case to ~38 min; a public repo
    # pays nothing for minutes, and a run killed at the limit publishes nothing at all. With since.sigwx (2026-10-13) and
    # the contrails parts (2026-10-21) relay.js's own whole-run limit is 2735 s (45.6 min), still under this timeout.
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      # GitHub disables the schedule of a public repo after 60 days without a commit, and the force-push to "data" is not
      # reliably counted as activity (review 2026-10-13): once a month a scheduled run commits KEEPALIVE to main.
      - name: Keep the schedule alive (a commit to main when the last one is older than 30 days)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf 'Last keep-alive commit: %s. GitHub disables the schedule after 60 days without a commit.\n' "$(date -u +%Y-%m-%d)" > KEEPALIVE
            git add KEEPALIVE
            git commit -q -m "Keep-alive $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main || echo "::warning title=WX relay::keep-alive commit not pushed (main moved?) - the next scheduled run tries again"
          else
            echo "Last commit on main $(( ($(date +%s) - last) / 86400 )) day(s) ago - no keep-alive needed."
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore the caches of the observed weather from the data branch (none = start fresh)
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            for f in $(git ls-tree --name-only FETCH_HEAD cache/ 2>/dev/null); do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/cache/$(basename "$f")" || rm -f "$RUNNER_TEMP/cache/$(basename "$f")"
            done
          fi
          ls -l "$RUNNER_TEMP/cache"

      - name: Fetch the data and write out/latest.json and out/cache/
        run: node relay.js --out out --cache "$RUNNER_TEMP/cache" --blocked "$RUNNER_TEMP/cache/blocked.json"

      - name: Privacy check of the output
        run: node privacy-check.js out/latest.json $(ls -d out/cache 2>/dev/null)

      - name: Publish latest.json and the caches to the data branch (one orphan commit, force-pushed)
        run: |
          set -euo pipefail
          cp out/latest.json "$RUNNER_TEMP/latest.json"
          mkdir -p "$RUNNER_TEMP/publish-cache"
          if [ -d out/cache ]; then cp out/cache/*.json "$RUNNER_TEMP/publish-cache/" 2>/dev/null || true; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data-publish
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          if ls "$RUNNER_TEMP"/publish-cache/*.json >/dev/null 2>&1; then
            mkdir -p cache
            cp "$RUNNER_TEMP"/publish-cache/*.json cache/
            git add cache
          fi
          git commit -q -m "latest.json $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:refs/heads/data

      - name: Keep a new stop note although the relay failed (the previous files stay, plus cache/blocked.json)
        if: failure() && hashFiles('out/cache/blocked.json') != '' && hashFiles('out/latest.json') == ''
        run: |
          set -euo pipefail
          node privacy-check.js out/cache/blocked.json
          cp out/cache/blocked.json "$RUNNER_TEMP/blocked.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data-note
          if git rev-parse -q --verify FETCH_HEAD >/dev/null; then git checkout FETCH_HEAD -- . ; fi
          mkdir -p cache
          cp "$RUNNER_TEMP/blocked.json" cache/blocked.json
          git add cache/blocked.json
          git commit -q -m "stop note $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:refs/heads/data

      # After the publish the work tree is the orphan data commit (out/ stays, it is not tracked): back to main for relay.js.
      - name: Fail the run while a stop note is in force (a host answered HTTP 403/429 in the last 24 h)
        run: |
          git switch -q main
          if [ -f out/cache/blocked.json ]; then node relay.js --check-blocked out/cache/blocked.json; else echo "relay: no stop note in force."; fi
